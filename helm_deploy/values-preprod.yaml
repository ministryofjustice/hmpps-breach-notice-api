---
# Per environment values which override defaults in hmpps-breach-notice-api/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: breach-notice-api-preprod.hmpps.service.justice.gov.uk

  env:
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: "applicationinsights.dev.json"
    HMPPS-AUTH_URL: "https://sign-in-preprod.hmpps.service.justice.gov.uk/auth"
    FRONTEND_URL: "https://breach-notice-preprod.hmpps.service.justice.gov.uk"
    NDELIUS-INTEGRATION-API_URL: "https://breach-notice-and-delius-preprod.hmpps.service.justice.gov.uk"

  allowlist:
    groups:
      - internal
      - unilink_staff
      - delius-preprod
      - mod-platform-live
