---
# Per environment values which override defaults in hmpps-breach-notice-api/values.yaml

generic-service:
  ingress:
    host: breach-notice-api.hmpps.service.justice.gov.uk

  env:
    HMPPS-AUTH_URL: "https://sign-in.hmpps.service.justice.gov.uk/auth"
    FRONTEND_URL: "https://breach-notice.hmpps.service.justice.gov.uk"
    NDELIUS-INTEGRATION-API_URL: "https://breach-notice-and-delius.hmpps.service.justice.gov.uk"

  allowlist:
    groups:
      - internal
      - unilink_staff
      - delius-prod

# CloudPlatform AlertManager receiver to route prometheus alerts to slack
# See https://user-guide.cloud-platform.service.justice.gov.uk/documentation/monitoring-an-app/how-to-create-alarms.html#creating-your-own-custom-alerts
generic-prometheus-alerts:
  alertSeverity: PROD_ALERTS_SEVERITY_LABEL
