  env:
    HMPPS-AUTH_URL: "https://sign-in.hmpps.service.justice.gov.uk/auth"
    FRONTEND_URL: "https://breach-notice.hmpps.service.justice.gov.uk"
    NDELIUS-INTEGRATION-API_URL: "https://breach-notice-and-delius.hmpps.service.justice.gov.uk"

  allowlist:
    groups:
      - internal
      - unilink_staff
      - delius-prod
      - mod-platform-live
